name: Cancel stuck Pages deployment (temporary)

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  cancel-stuck-pages-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: List Pages deployments and cancel only bac8b788
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/cancel_pages.py <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          REPO = "elglass311/firefly-2-web-app"
          TARGET_SHA = "bac8b788873adc1651edd71aa28de8984fe7b77d"
          KNOWN_ID = 7582972737
          TARGET_CREATED = "2026-11-05T19:16:48Z"
          TOKEN = os.environ["GH_TOKEN"]
          BASE = "https://api.github.com/repos/" + REPO

          def call(method, url):
              req = urllib.request.Request(url, method=method)
              req.add_header("Authorization", "Bearer " + TOKEN)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status, resp.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          status0, body0 = call("GET", BASE)
          print("GET repo HTTP " + str(status0))
          print(body0[:500])
          status, body = call("GET", BASE + "/pages/deployments?per_page=100")
          print("LIST pages/deployments HTTP " + str(status))
          print(body)
          try:
              pages = json.loads(body) if body.strip() else []
          except Exception as exc:
              print("Could not parse Pages deployments list: " + str(exc))
              pages = []
          if not isinstance(pages, list):
              print("Pages deployments list was not a list (likely 404); continuing to verified fallback by deployment id.")
              pages = []

          target_id = None
          for d in pages:
              print("pages deployment id=" + str(d.get("id")) + " sha=" + str(d.get("sha")) + " status=" + str(d.get("status")) + " created_at=" + str(d.get("created_at")))
              if str(d.get("sha") or "").lower() == TARGET_SHA:
                  target_id = d.get("id")
          if target_id is None:
              for d in pages:
                  if str(d.get("created_at") or "") == TARGET_CREATED and str(d.get("status") or "") == "in_progress":
                      target_id = d.get("id")
                      print("Matched by created_at/status: " + str(target_id))
          if target_id is None:
              in_progress = [d for d in pages if str(d.get("status") or "") == "in_progress"]
              if len(in_progress) == 1:
                  target_id = in_progress[0].get("id")
                  print("Only one in_progress Pages deployment; using it: " + str(target_id))
          if target_id is None:
              print("No Pages deployment matched " + TARGET_SHA + "; checking known general deployment id " + str(KNOWN_ID))
              status2, body2 = call("GET", BASE + "/deployments/" + str(KNOWN_ID))
              print("GET deployment HTTP " + str(status2))
              print(body2)
              try:
                  dep = json.loads(body2)
              except Exception:
                  dep = {}
              if isinstance(dep, dict) and dep.get("id") == KNOWN_ID and str(dep.get("sha") or "").lower() == TARGET_SHA:
                  target_id = KNOWN_ID
                  print("Verified known id matches target SHA")
          if target_id is None:
              print("No target Pages deployment identified; aborting without cancelling anything.")
              sys.exit(1)

          print("Cancelling Pages deployment " + str(target_id) + " for " + TARGET_SHA + " only")
          status3, body3 = call("POST", BASE + "/pages/deployments/" + str(target_id) + "/cancel")
          print("CANCEL HTTP " + str(status3))
          print(body3)
          if 200 <= status3 < 300:
              print("CANCEL SUCCEEDED")
          else:
              print("CANCEL FAILED")
              sys.exit(1)
          PY
          python3 /tmp/cancel_pages.py
